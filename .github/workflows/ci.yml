name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Lint (pyflakes rules and syntax errors; the scripts themselves stay stdlib-only)
        run: |
          python -m pip install "ruff==0.8.4"
          ruff check --select F,E9 --target-version py39 skills
      - name: Stdlib-only guard (no third-party imports in shipped scripts)
        run: python .github/stdlib_guard.py
      - name: trading-research tests and golden fixtures
        run: python skills/trading-research/evals/run_tests.py
      - name: trading-execution tests and golden fixtures
        run: python skills/trading-execution/evals/run_tests.py
      - name: Shipped MCP configs are pinned
        run: |
          python skills/trading-research/scripts/mcp_lock.py check-config --config skills/trading-research/assets/mcp-config.research.json --lock skills/trading-research/assets/mcp-lock.json
          python skills/trading-execution/scripts/mcp_lock.py check-config --config skills/trading-execution/assets/mcp-config.paper-execute.json --lock skills/trading-execution/assets/mcp-lock.json
